services:
  coach-bot:
    image: ghcr.io/greglibert/telegram-ai-nutrition-coach-bot:latest
    container_name: nutrition-coach-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/coach.db
      HTTP_ADDR: ":8080"
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
